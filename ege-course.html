    function makeSocialExercise(topic, n) {
      const scenario = socialCases[topic[3]];
      const context = 'Ситуация: ' + scenario[0] + '\n';
      const formats = [
        ['Какое обществоведческое понятие иллюстрирует ситуация?', scenario[1]],
        ['Назови ключевой признак понятия, который проявился в ситуации.', scenario[2]],
        ['Какая деталь условия помогает определить это понятие?', scenario[3]],
        ['Сформулируй вывод, который следует из описанной ситуации.', scenario[4]],
        ['Объясни, почему описанный случай относится к понятию «' + scenario[1] + '».', scenario[3] + ' Поэтому ситуацию можно отнести к понятию «' + scenario[1] + '».'],
        ['Какое правило или свойство темы подтверждается примером?', scenario[2]],
        ['Как участники или институты проявляют себя в данной ситуации?', scenario[3]],
        ['Какой результат или общественное последствие описано?', scenario[4]],
        ['Подбери точный термин к ситуации и обоснуй выбор.', scenario[1] + '. Обоснование: ' + scenario[3]],
        ['Запиши краткий ответ и поясни его одним предложением.', scenario[4] + ' Основание: ' + scenario[3]]
      ];
      return [context + formats[n-1][0], formats[n-1][1]];
    }

    function makeInfoExercise(kind, n, taskIndex) {
      switch (kind) {
        case 'model': {
          const models = [
            ['расписание поездов','Таблица: строка описывает поезд, столбец — его атрибут.'],
            ['результаты спортивного турнира','Таблица: строка описывает участника, столбец — показатель.'],
            ['наличие книг в библиотеке','Таблица: запись описывает книгу, поле — её характеристику.'],
            ['температура по дням недели','График или таблица: день является аргументом, температура — значением.'],
            ['схема станций метро','Граф: вершины — станции, рёбра — переходы между ними.'],
            ['состав школьного расписания','Таблица: запись описывает урок, поля — время, кабинет и предмет.'],
            ['родственные связи в семье','Дерево: вершины обозначают людей, рёбра — отношения родства.'],
            ['маршруты между городами','Взвешенный граф: города — вершины, дороги — рёбра с длиной.'],
            ['анкета участников конкурса','Таблица: строка соответствует участнику, поле — вопросу анкеты.'],
            ['план этажей здания','Схема: объекты и связи на ней соответствуют планировке.']
          ];
          return ['Выбери модель для описания: ' + models[n-1][0] + '. Назови один её элемент.', models[n-1][1]];
        }
        case 'truth': { const bits=Array.from({length:4},function(_,index){return Math.floor((n-1)/(2**index))%2===1;}); const [a,b,c,d]=bits; const result=(a&&!b)||(c&&d); const display=function(value){return value?'ИСТИНА':'ЛОЖЬ';}; return ['Система выдаёт сигнал по условию (A И НЕ B) ИЛИ (C И D). Для набора A='+display(a)+', B='+display(b)+', C='+display(c)+', D='+display(d)+' вычисли результат.','Сначала НЕ B='+display(!b)+', затем A И НЕ B='+(a&&!b?'ИСТИНА':'ЛОЖЬ')+', C И D='+(c&&d?'ИСТИНА':'ЛОЖЬ')+'. Итог: '+display(result)+'.']; }
        case 'database': { const values=[n,n+2,n+4,n+6], threshold=n+3, matches=values.filter(function(value){return value>=threshold;}); return ['Таблица «Замеры» содержит значения '+values.join(', ')+'. Запрос выбирает записи, где значение не меньше '+threshold+'. Сколько строк останется после фильтрации?','Условию подходят '+matches.join(' и ')+'. Отбираем '+matches.length+' строки, значит, запрос вернёт '+matches.length+'.']; }
        case 'coding': return ['Алфавит устройства содержит '+(2**n)+' равновероятных символов. Каждый символ кодируют двоичным кодом одинаковой длины. Найди минимальную длину кода в битах.','Для кода длины k доступно 2ᵏ комбинаций. Так как 2^'+n+'='+(2**n)+', достаточно и необходимо '+n+' бит.'];
        case 'executor': return ['Исполнитель находится в точке 0 на числовой прямой. Программа '+n+' раз выполняет команду «перейти на 1 единицу вправо». Укажи конечную координату.','Каждая команда прибавляет 1: x=0+'+n+'·1='+n+'. Исполнитель окажется в точке '+n+'.'];
        case 'trace': return ['В начале алгоритма x=2. Затем цикл '+n+' раз выполняет x:=x+3. Запиши конечное значение переменной x.','За '+n+' повторений прибавится 3·'+n+'='+3*n+'. Поэтому x=2+'+(3*n)+'='+ (2+3*n)+'.'];
        case 'media': return ['Иконка имеет размер 2×'+(n+1)+' пикселей и хранится без сжатия; на каждый пиксель отводится 8 бит. Найди объём изображения в битах.','Число пикселей: 2·'+(n+1)+'='+(2*(n+1))+'. Объём: I=N·i='+(2*(n+1))+'·8='+(16*(n+1))+' бит.'];
        case 'systems': { const value=n+5, binary=value.toString(2); return ['Переведи десятичное число '+value+' в двоичную систему счисления. Покажи, как проверить ответ.','Последовательно делим '+value+' на 2 и записываем остатки в обратном порядке: '+value+'₁₀='+binary+'₂.']; }
        case 'search': { const values=[n,n+1,n+3,n+4,n+7], threshold=n+3, matches=values.filter(function(value){return value>=threshold;}); return ['В каталоге указаны значения поля «код»: '+values.join(', ')+'. Поисковый запрос оставляет записи, где код ≥ '+threshold+'. Сколько записей попадёт в результат?','После сравнения с порогом остаются коды '+matches.join(', ')+'. В результате '+matches.length+' записи.']; }
        case 'spreadsheet': return ['В электронной таблице в ячейках A1, A2 и A3 записаны соответственно '+n+', '+(n+2)+' и '+(n+5)+'. Какой результат вернёт формула =СУММ(A1:A3)?','Формула складывает все три ячейки: '+n+'+'+(n+2)+'+'+(n+5)+'='+(3*n+7)+'.'];
        case 'volume': return ['Архив содержит файл размером '+n+' КиБ. Считай, что 1 КиБ=1024 байта и 1 байт=8 бит. Сколько бит занимает файл?','Переводим единицы: '+n+'·1024·8='+(n*8192)+' бит.'];
        case 'combinatorics': return ['Пароль состоит из '+n+' двоичных знаков; каждый знак может быть 0 или 1. Сколько разных паролей такой длины возможно?','Для каждой из '+n+' позиций есть 2 выбора: 2·2·…·2=2^'+n+'='+(2**n)+' паролей.'];
        case 'games': { const start=n+1, move=start<=2?start:null; return ['В игре фишка стоит на числе '+start+'. За ход разрешено уменьшить число на 1 или на 2; выигрывает тот, кто первым получает 0. Есть ли ход, который завершает игру сразу?','До нуля за один ход можно дойти только из 1 или 2. '+(move?'Да: вычесть '+move+'.':'Нет: из '+start+' ни вычитание 1, ни вычитание 2 не даёт 0.')]; }
        case 'logic': { const bits=Array.from({length:4},function(_,index){return Math.floor((n-1)/(2**index))%2===1;}); const [a,b,c,d]=bits, result=!(a&&b)||(c&&d), display=function(value){return value?'ИСТИНА':'ЛОЖЬ';}; return ['Вычисли НЕ(A И B) ИЛИ (C И D) при A='+display(a)+', B='+display(b)+', C='+display(c)+', D='+display(d)+'. Соблюдай скобки и приоритет операций.','A И B='+(a&&b?'ИСТИНА':'ЛОЖЬ')+'; НЕ(A И B)='+display(!(a&&b))+'; C И D='+display(c&&d)+'. Итог: '+display(result)+'.']; }
        case 'loops': return ['Программа обнуляет S, затем для каждого целого i от 1 до '+n+' включительно выполняет S:=S+i. Чему будет равно S после цикла?','Цикл складывает числа от 1 до '+n+'. S=1+2+…+'+n+'='+n+'·('+(n+1)+')/2='+(n*(n+1)/2)+'.'];
        case 'recursion': { const valueN=n+2; let value=1; for(let i=2;i<=valueN;i+=1)value*=i; return ['Рекурсивная функция задана так: F(1)=1, F(k)=k·F(k−1). Проследи вызовы и найди F('+valueN+').','Раскрываем рекурсию до базового случая: F('+valueN+')='+Array.from({length:valueN},function(_,index){return index+1;}).join('·')+'='+value+'.']; }
        case 'graphs': return ['На схеме сети '+(n+2)+' узла соединены так, что между любыми двумя узлами есть ровно один путь и циклов нет. Сколько рёбер в такой сети?','Это дерево. В дереве на '+(n+2)+' вершинах всегда на одну вершину меньше рёбер: E=V−1='+(n+2)+'−1='+(n+1)+'.'];
        case 'dynamic': { const ways=[0,1,2]; for(let i=3;i<=n+2;i+=1)ways[i]=ways[i-1]+ways[i-2]; return ['Число способов подняться на k ступеней, если за ход можно пройти 1 или 2 ступени, задаётся рекуррентно: dp₁=1, dp₂=2, dpₖ=dpₖ₋₁+dpₖ₋₂. Найди dpₖ для k='+(n+2)+'.','Начинаем с dp₁=1 и dp₂=2, затем складываем два предыдущих значения. Получаем dp'+(n+2)+'='+ways[n+2]+'.']; }
        case 'arrays': { const values=[n,n+4,2*n-1,n+2], maximum=Math.max.apply(null,values), position=values.indexOf(maximum)+1; return ['Дан массив по порядку: ['+values.join(', ')+']. Найди наибольший элемент и номер его первого появления, считая позиции с 1.','Сравниваем элементы: максимум '+maximum+' впервые стоит на позиции '+position+'.']; }
        case 'files': return ['В каталоге проекта лежат '+n+' подпапок. В каждой подпапке по 2 файла, а в корне каталога находятся ещё 3 файла. Сколько файлов во всём проекте?','В подпапках '+n+'·2='+(2*n)+' файла; добавляем 3 файла в корне: '+(2*n)+'+3='+(2*n+3)+'.'];
        case 'strings': { const text='abca'.repeat(n); return ['Строка S образована '+n+' повторениями фрагмента «abca». Найди длину строки и количество букв «a».','В каждом фрагменте 4 символа и 2 буквы «a». Длина S=4·'+n+'='+(4*n)+'; букв «a» — 2·'+n+'='+(2*n)+'.']; }
        case 'sequence': return ['Арифметическая последовательность начинается с a₁='+n+'; каждый следующий член на 3 больше предыдущего. Найди a₄ и запиши использованную формулу.','a₄=a₁+3d='+n+'+3·3='+(n+9)+'.'];
        case 'algorithms': return ['Искомый идентификатор находится в конце неупорядоченного списка из '+n+' различных записей. Алгоритм проверяет записи слева направо и останавливается при совпадении. Сколько сравнений он выполнит?','Элемент стоит последним, поэтому будут проверены все '+n+' записей. Требуется '+n+' сравнений.'];
        case 'data': return ['Три датчика зафиксировали значения '+n+', '+(n+2)+' и '+(n+4)+'. Вычисли среднее показание; промежуточное округление не требуется.','Сумма равна '+n+'+'+(n+2)+'+'+(n+4)+'='+(3*n+6)+'. Делим на 3: среднее='+(n+2)+'.'];
        case 'branch': { const result=n>5; return ['В программе x='+n+'. Условие ветвления: если x>5, вывести «да», иначе вывести «нет». Какая строка появится на экране?','Проверяем '+n+'>5: это '+(result?'истина':'ложь')+'. Выполнится ветвь «'+(result?'да':'нет')+'».']; }
        case 'count': return ['Для первого элемента кода можно выбрать один из '+n+' символов, а для второго — один из двух. Сколько двухсимвольных кодов получится, если повторения разрешены?','Выборы независимы, применяем правило произведения: '+n+'·2='+(2*n)+' кодов.'];
        default: { const evens=[]; for(let i=1;i<=n;i+=1)if(i%2===0)evens.push(i); const sum=evens.reduce(function(total,value){return total+value;},0); return ['Алгоритм задаёт S:=0, затем для i от 1 до '+n+' выполняет: если i делится на 2, то S:=S+i. Найди итоговое значение S.','В сумму входят только чётные числа до '+n+': '+(evens.length?evens.join('+'):'чётных слагаемых нет')+'. Поэтому S='+sum+'.']; }
      }
    }

    function renderCatalog() {
      grid.innerHTML = course.topics.map(function(topic, index) {
        return '<button class="task-card" type="button" data-task="' + (index+1) + '"><span class="task-number">' + String(index+1).padStart(2,'0') + '</span><span class="task-copy"><strong>' + topic[0] + '</strong><span>' + readProgress(index).length + ' из 10 разобрано</span></span></button>';
      }).join('');
      grid.querySelectorAll('.task-card').forEach(function(card) { card.addEventListener('click', function() { openTask(Number(card.dataset.task)); }); });
      document.getElementById('solvedTotal').textContent = String(countSolved());
    }

    function renderExercises(taskIndex, topic) {
      const solved = readProgress(taskIndex);
      return buildExercises(taskIndex, topic).map(function(item,index) {
        const seen=solved.includes(index);
        return '<article class="exercise' + (seen?' solved':'') + '" id="exercise-' + index + '"><div class="exercise-top"><span class="exercise-index">' + String(index+1).padStart(2,'0') + '</span><p class="exercise-prompt">' + item[0] + '</p></div><button class="reveal" type="button" data-exercise="' + index + '">' + (seen?'Скрыть ответ':'Показать ответ') + '</button><div class="answer' + (seen?' open':'') + '"><strong>Ответ:</strong> ' + item[1] + '</div></article>';
      }).join('');
    }

    function openTask(number, replace) {
      if(number<1||number>course.topics.length)return;
      const index=number-1, topic=course.topics[index];
      if(replace)history.replaceState(null,'','?subject='+subjectId+'&task='+number);else history.pushState(null,'','?subject='+subjectId+'&task='+number);
      catalog.classList.add('hidden'); detail.classList.add('active');
      const supportClass=course.formula||subjectId==='math'?'formula':'rule';
      const supportTitle=course.formula||subjectId==='math'?'Формула / опора':'Как решать';
      const support='<div class="'+supportClass+'"><strong>'+supportTitle+':</strong> '+topic[2]+'</div>';
      detail.innerHTML=
        '<div class="detail-top"><span class="badge">'+String(number).padStart(2,'0')+'</span><div><h2>'+topic[0]+'</h2><p>'+examName+' · '+course.name+' · задание '+number+'</p></div><div class="detail-nav"><button class="icon-button" id="previousTask" type="button" aria-label="Предыдущий номер"'+(number===1?' disabled':'')+'>‹</button><button class="icon-button" id="nextTask" type="button" aria-label="Следующий номер"'+(number===course.topics.length?' disabled':'')+'>›</button></div></div>'+
        '<section class="panel"><h3>Теория</h3><p>'+topic[1]+'</p>'+support+'</section>'+
        '<div class="practice-head"><h3>Тренировка</h3><span id="taskProgress"></span></div><div class="exercise-list" id="exerciseList">'+renderExercises(index,topic)+'</div>'+
        '<div class="detail-footer"><button class="action" id="backToCatalog" type="button">Все задания</button><button class="action primary" id="nextTaskFooter" type="button"'+(number===course.topics.length?' disabled':'')+'>Следующий номер →</button></div>';
      document.getElementById('previousTask').addEventListener('click',function(){openTask(number-1);});
      document.getElementById('nextTask').addEventListener('click',function(){openTask(number+1);});
      document.getElementById('nextTaskFooter').addEventListener('click',function(){openTask(number+1);});
      document.getElementById('backToCatalog').addEventListener('click',function(){history.pushState(null,'','?subject='+subjectId);showCatalog();});
      detail.querySelectorAll('.reveal').forEach(function(button){button.addEventListener('click',function(){revealAnswer(index,Number(button.dataset.exercise));});});
      updateProgress(index); window.scrollTo(0,0);
    }

    function revealAnswer(taskIndex,exerciseIndex) {
      const card=document.getElementById('exercise-'+exerciseIndex), answer=card.querySelector('.answer'), button=card.querySelector('.reveal'), solved=readProgress(taskIndex);
      if(answer.classList.contains('open')){answer.classList.remove('open');button.textContent='Показать ответ';return;}
      answer.classList.add('open');card.classList.add('solved');button.textContent='Скрыть ответ';
      if(!solved.includes(exerciseIndex)){solved.push(exerciseIndex);localStorage.setItem(progressKey(taskIndex),JSON.stringify(solved));document.getElementById('solvedTotal').textContent=String(countSolved());updateProgress(taskIndex);}
    }
    function updateProgress(index){const label=document.getElementById('taskProgress');if(label)label.textContent=readProgress(index).length+' из 10 разобрано';}
    function showCatalog(){catalog.classList.remove('hidden');detail.classList.remove('active');detail.innerHTML='';renderCatalog();window.scrollTo(0,0);}
    document.getElementById('backButton').addEventListener('click',function(){if(detail.classList.contains('active')){history.pushState(null,'','?subject='+subjectId);showCatalog();}else window.location.href='exam.html';});
    window.addEventListener('popstate',function(){const number=Number(new URLSearchParams(window.location.search).get('task'));if(number)openTask(number,true);else showCatalog();});
    renderCatalog(); if(taskParam)openTask(Number(taskParam),true);
  </script>
</body>
</html>
