<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Флеш-карты — MAX App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #17233d;
            --muted: #74809a;
            --paper: #f7f8fc;
            --surface: #fff;
            --surface-alt: #f1f3f8;
            --line: #e7eaf1;
            --coral: #ff6b57;
            --blue: #5479e8;
            --teal: #20a995;
            --shadow: 0 16px 44px rgba(23, 35, 61, .08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: 96px;
            color: var(--ink);
            background: linear-gradient(145deg,#eef1fb 0%,#fdf8f5 55%,#e9f5f3 100%);
            font-family: 'DM Sans', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0 0 auto;
            height: 230px;
            background: #eef1fb;
            z-index: -1;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 22px 20px 18px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255,255,255,.82);
            color: var(--ink);
            font-size: 25px;
            cursor: pointer;
        }

        .title {
            margin: 0;
            font: 700 28px 'Space Grotesk', sans-serif;
            letter-spacing: -.04em;
            color: var(--ink);
        }

        .header-space { width: 38px; }

        main {
            flex: 1;
            padding: 8px 20px 30px;
        }

        .hero-card {
            background: rgba(255,255,255,.82);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: 0 5px 18px rgba(23,35,61,.04);
            margin-bottom: 18px;
        }

        .hero-card h2 {
            margin: 0 0 8px;
            font: 700 24px 'Space Grotesk', sans-serif;
            letter-spacing: -.04em;
        }

        .hero-card p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .flash-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .flash-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 6px 10px;
            background: var(--surface-alt);
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .flash-content {
            font: 700 18px 'Space Grotesk', sans-serif;
            line-height: 1.4;
            letter-spacing: -.02em;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            text-align: center;
            padding: 8px 6px;
            cursor: pointer;
        }

        .flash-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .action-btn {
            width: 100%;
            min-height: 48px;
            padding: 12px 18px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff6b57, #ff8f7a);
            color: #fff;
            font: 700 14px 'DM Sans', sans-serif;
            letter-spacing: .04em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(255,107,87,.18);
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .nav-link-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255,255,255,.6);
            color: var(--muted);
            text-decoration: none;
            font: 700 11px 'DM Sans', sans-serif;
            letter-spacing: .03em;
            text-transform: uppercase;
        }

        .nav-link-btn.active {
            background: var(--coral);
            color: #fff;
            border-color: var(--coral);
        }

        .bottom-nav {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            padding: 12px 18px 17px;
            background: rgba(255, 255, 255, .94);
            border-top: 1px solid var(--line);
        }

        .nav-item {
            display: grid;
            justify-items: center;
            gap: 5px;
            color: #a0a7b8;
            background: transparent;
            border: 0;
            font: 600 12px 'DM Sans', sans-serif;
            cursor: pointer;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item.active {
            color: var(--coral);
        }

        body.dark {
            --ink: #f4f5f8;
            --muted: #aab4c8;
            --paper: #0e0f13;
            --surface: #24272f;
            --surface-alt: #2d3038;
            --line: #383c46;
            background: var(--paper);
        }

        body.dark::before { background: #171c28; }
        body.dark .hero-card,
        body.dark .flash-card,
        body.dark .nav-link-btn,
        body.dark .bottom-nav {
            background: #24272f;
            border-color: #383c46;
        }
        body.dark .nav-link-btn { background: #2d3038; }
        body.dark .flash-content,
        body.dark .title,
        body.dark .hero-card h2 { color: #fff; }
        body.dark .hero-card p,
        body.dark .flash-meta,
        body.dark .nav-link-btn {
            color: #aab4c8;
        }
        body.dark .nav-item { color: #a0a7b8; }
        body.dark .nav-item.active { color: #ff8f7a; }
        body.dark .bottom-nav { background: #15171c; border-color: #272a32; }

        @media (min-width: 600px) {
            body { padding-top: 20px; padding-bottom: 108px; }
            .app-shell { min-height: calc(100vh - 40px); box-shadow: var(--shadow); border-radius: 28px; overflow: hidden; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <button class="back-btn" type="button" onclick="window.location.href='bot.html'" aria-label="Назад">‹</button>
            <h1 class="title">Флеш-карты</h1>
            <div class="header-space"></div>
        </header>

        <main>
            <section class="hero-card">
                <h2>Запоминай быстрее</h2>
                <p>Тренируйте память с помощью интерактивных карточек без зубрёжки.</p>
            </section>

            <section class="flash-card" aria-live="polite">
                <div class="flash-label">Карточка</div>
                <div class="flash-content" id="cardZone" role="button" tabindex="0" onclick="flipCard()" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flipCard(); }">
                    Вопрос: Что такое замыкание в программировании?
                </div>
                <div class="flash-meta">
                    <span id="cardCounter">1 / 3</span>
                    <span>Нажмите, чтобы открыть ответ</span>
                </div>
            </section>

            <button class="action-btn" type="button" onclick="nextCard()">Следующая карточка</button>

            <div class="nav-links" aria-label="Секции">
                <a href="flashcards.html" class="nav-link-btn active">Карты</a>
                <a href="video.html" class="nav-link-btn">Видео</a>
                <a href="test.html" class="nav-link-btn">Тесты</a>
            </div>
        </main>
    </div>

    <nav class="bottom-nav" aria-label="Главная навигация">
        <button class="nav-item" id="homeNav" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-6h6v6"/></svg>
            Главная
        </button>
        <button class="nav-item" id="profileNav" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            Профиль
        </button>
        <button class="nav-item" id="botNav" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"/></svg>
            Бот
        </button>
    </nav>

    <script>
        const cards = [
            { q: 'Вопрос: Что такое замыкание в программировании?', a: 'Ответ: Функция вместе со всеми ее лексическими окружениями.' },
            { q: 'Вопрос: Какова сложность поиска в бинарном дереве?', a: 'Ответ: O(log n) в сбалансированном состоянии.' },
            { q: 'Вопрос: Зачем нужен метод useEffect в React?', a: 'Ответ: Для выполнения побочных эффектов в функциональных компонентах.' }
        ];

        let idx = 0;
        let isFlipped = false;

        function renderCard() {
            const card = cards[idx];
            document.getElementById('cardZone').textContent = isFlipped ? card.a : card.q;
            document.getElementById('cardCounter').textContent = (idx + 1) + ' / ' + cards.length;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderCard();
        }

        function nextCard() {
            idx = (idx + 1) % cards.length;
            isFlipped = false;
            renderCard();
        }

        document.body.classList.toggle('dark', localStorage.getItem('dark_theme') === 'true');

        document.getElementById('homeNav').addEventListener('click', function () {
            window.location.href = 'app.html';
        });

        document.getElementById('profileNav').addEventListener('click', function () {
            window.location.href = 'profile.html';
        });

        document.getElementById('botNav').addEventListener('click', function () {
            window.location.href = 'bot.html';
        });

        renderCard();
    </script>
</body>
</html>
