<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Выбор героя — MAX App</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      --card-bg: rgba(255,255,255,0.08);
      --card-border: rgba(255,255,255,0.15);
      --text-main: #f0f0ff;
      --text-secondary: #a0a0c0;
      --accent: #7c5cff;
      --accent-light: #9d7fff;
      --radius: 16px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; }
    header { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 14px 16px; border-bottom: 1px solid var(--card-border); text-align: center; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 14px; color: var(--text-secondary); }
    main { max-width: 440px; margin: 0 auto; padding: 24px 16px 100px; }
    .preview-box { width: 160px; height: 200px; margin: 0 auto 24px; border: 2px solid var(--card-border); border-radius: 20px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
    .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .class-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: var(--radius); padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .class-card:active { transform: scale(0.96); }
    .class-card.selected { border-color: var(--accent-light); background: rgba(124,92,255,0.15); box-shadow: 0 0 20px rgba(124,92,255,0.3); }
    .class-card .icon { width: 48px; height: 60px; margin: 0 auto 8px; }
    .class-card .icon img { width: 100%; height: 100%; object-fit: contain; }
    .class-card h3 { margin: 0; font-size: 15px; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(26,26,46,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 16px; border-top: 1px solid var(--card-border); }
    .save-btn { width: 100%; max-width: 440px; margin: 0 auto; display: block; padding: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(124,92,255,0.3); }
    .save-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>Выбери своего героя</h1>
    <p>Каждый герой уникален — выбери того, кто тебе по душе</p>
  </header>
  <main>
    <div class="preview-box"><img id="preview" src="" alt="" style="display:none;"></div>
    <div class="class-grid" id="grid"></div>
  </main>
  <div class="bottom-bar"><button class="save-btn" id="saveBtn">Сохранить и продолжить</button></div>
  <script>
    var icons = { paladin:"paladin.png.png", necromancer:"necromancer.png.png", rogue:"rogue.png.png", mage:"mage.png.png", berserker:"berserker.png.png" };
    var names = { paladin:"Паладин", necromancer:"Маг", rogue:"Разбойница", mage:"Маг стихий", berserker:"Берсерк" };
    var currentClass = localStorage.getItem("avatar_class") || "paladin";
    var grid = document.getElementById("grid");
    var preview = document.getElementById("preview");
    for (var key in names) {
      (function(k) {
        var card = document.createElement("div");
        card.className = "class-card";
        if (k === currentClass) card.classList.add("selected");
        card.innerHTML = '<div class="icon"><img src="' + icons[k] + '"></div><h3>' + names[k] + '</h3>';
        card.addEventListener("click", function() {
          currentClass = k;
          document.querySelectorAll(".class-card").forEach(function(c) { c.classList.remove("selected"); });
          card.classList.add("selected");
          preview.src = icons[k];
          preview.style.display = "block";
        });
        grid.appendChild(card);
      })(key);
    }
    preview.src = icons[currentClass];
    preview.style.display = "block";
    document.getElementById("saveBtn").addEventListener("click", function() {
      localStorage.setItem("avatar_class", currentClass);
      window.location.href = "app.html";
    });
  </script>
</body>
</html>
