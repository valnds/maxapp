<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Профиль — MAX App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f5f8;--muted:#9ca3b2;--bg:#0e0f13;--panel:#24272f;--panel2:#2d3038;--line:#383c46;--blue:#1677ed;--accent:#9b6cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;display:flex;flex-direction:column}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#101115;position:sticky;top:0;z-index:2}header h1{margin:0;font:700 20px 'Space Grotesk',sans-serif}.back{width:38px;height:38px;border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}.space{width:38px}main{flex:1;padding:27px 20px 30px}.profile{text-align:center;margin-bottom:27px}.avatar{width:96px;height:96px;padding:5px;margin:0 auto 13px;border:3px solid #4a4e5a;border-radius:50%;background:#343844;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:contain}.profile h2{margin:0 0 6px;font:700 28px 'Space Grotesk',sans-serif}.id{margin:0;color:var(--blue);font-size:16px;font-weight:600}.role{display:inline-block;margin-top:9px;padding:6px 12px;color:#d7c6ff;background:#312451;border-radius:20px;font-size:12px;font-weight:700}.group{margin-bottom:14px;overflow:hidden;background:var(--panel);border-radius:19px}.row{display:flex;align-items:center;gap:14px;min-height:76px;padding:13px 17px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-of-type{border-bottom:0}.icon{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto}.icon svg{width:27px;height:27px}.copy{flex:1;min-width:0}.copy strong{display:block;font-size:17px}.copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#aeb3bd;font-size:30px}.control{display:none;padding:0 17px 16px 69px}.control.open{display:block}.input,.select{width:100%;padding:11px 12px;margin-bottom:9px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;font:14px 'DM Sans',sans-serif}.action{width:100%;padding:11px;color:white;background:var(--blue);border:0;border-radius:10px;font:700 13px 'DM Sans',sans-serif;cursor:pointer}.heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hero{padding:8px;text-align:center;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:11px;cursor:pointer}.hero.selected{border:2px solid var(--accent)}.hero img{display:block;width:45px;height:52px;margin:auto;object-fit:contain}.hero span{font-size:11px}.switch{width:44px;height:25px;padding:3px;border:0;border-radius:20px;background:#555b68;cursor:pointer}.switch:after{content:'';display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--blue)}.switch.on:after{transform:translateX(19px)}.nav{display:flex;justify-content:space-around;padding:12px 16px 16px;background:#15171c;border-top:1px solid #272a32}.nav button{display:grid;justify-items:center;gap:4px;color:#858b98;background:transparent;border:0;font:600 10px 'DM Sans',sans-serif}.nav svg{width:21px;height:21px}.nav .active{color:var(--blue)}@media(min-width:600px){body{padding:20px 0;background:#08090b}.app{min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px #000}}
</style>
<style>
:root{--ink:#17233d;--muted:#74809a;--bg:#f7f8fc;--panel:#fff;--panel2:#f1f3f8;--line:#e7eaf1;--blue:#5479e8;--accent:#ff6b57}
body{background:linear-gradient(145deg,#eef1fb 0%,#fdf8f5 55%,#e9f5f3 100%);color:var(--ink)}header{background:rgba(255,255,255,.82);border-bottom:1px solid var(--line)}.back{color:var(--ink)}.avatar{background:#dfe5fa;border-color:#fff}.role{color:#c3661b;background:#fff2d9}.group{background:rgba(255,255,255,.86);box-shadow:0 5px 16px rgba(23,35,61,.05)}.row{border-color:var(--line)}.arrow{color:#aeb3bd}.switch.on{background:var(--accent)}.nav{background:rgba(255,255,255,.94);border-color:var(--line)}.nav button{color:#a0a7b8}.nav .active{color:var(--accent)}
.row[data-open="outfitControl"],#outfitControl,#schoolControl,#roleControl{display:none!important}
body.dark{--ink:#f4f5f8;--muted:#aab4c8;--bg:#0e0f13;--panel:#24272f;--panel2:#2d3038;--line:#383c46;background:var(--bg)}body.dark header{background:#101115;border-color:#272a32}body.dark .back{color:#fff}body.dark .group{background:var(--panel)}body.dark .nav{background:#15171c;border-color:#272a32}body.dark .profile h2,body.dark .copy strong{color:#fff}body.dark .copy span{color:#aab4c8}body.dark .icon{color:#86a8ff}body.dark .group:first-of-type .row:nth-of-type(1) .icon{color:#ff8271}body.dark .group:first-of-type .row:nth-of-type(3) .icon{color:#55c7b2}body.dark .group:last-of-type .row:nth-of-type(1) .icon{color:#c18cff}body.dark .group:last-of-type .row:nth-of-type(2) .icon{color:#f2b94b}
</style>
</head>
<body><div class="app"><header><button class="back" id="back">‹</button><h1>Профиль</h1><div class="space"></div></header><main>
<section class="profile"><div class="avatar"><img id="avatar" src="paladin.png" alt=""></div><h2 id="name">Ученик</h2><p class="id" id="maxId"></p><span class="role" id="roleBadge">Ученик</span></section>
<section class="group"><div class="row" data-open="heroControl"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></div><div class="copy"><strong>Персонаж</strong><span id="heroText">Паладин</span></div><b class="arrow">›</b></div><div class="control" id="heroControl"><div class="heroes" id="heroes"></div><button class="action" id="saveHero">Сохранить персонажа</button></div>
<div class="row" data-open="outfitControl"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 4 4 3 4-3 4 3v13H4V7l4-3Z"/><path d="M8 4v5M16 4v5"/></svg></div><div class="copy"><strong>Внешний вид</strong><span id="outfitText">Закатный стиль</span></div><b class="arrow">›</b></div><div class="control" id="outfitControl"><div class="heroes"><button class="hero selected" data-outfit="Закатный">Закат</button><button class="hero" data-outfit="Океанский">Океан</button><button class="hero" data-outfit="Лесной">Лес</button></div></div>
<div class="row" data-open="schoolControl"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-6 9 6v10H3V10Z"/><path d="M9 20v-6h6v6"/></svg></div><div class="copy"><strong>Моя школа</strong><span id="schoolText">Школа не привязана</span></div><b class="arrow">›</b></div><div class="control" id="schoolControl"><input class="input" id="school" placeholder="Например, Лицей № 12"><button class="action" id="saveSchool">Сохранить школу</button></div></section>
<section class="group"><div class="row" data-open="roleControl"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 7v5c0 4.5 3.4 7.8 8 9 4.6-1.2 8-4.5 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="copy"><strong>Роль в MAX</strong><span id="roleText">Ученик</span></div><b class="arrow">›</b></div><div class="control" id="roleControl"><select class="select" id="role"><option value="student">Ученик</option><option value="teacher">Учитель</option><option value="leader">Староста</option></select><button class="action" id="saveRole">Сохранить роль</button></div><div class="row"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg></div><div class="copy"><strong>Тёмная тема</strong><span>Удобный вид для вечернего обучения</span></div><button class="switch on" id="theme" aria-label="Тёмная тема"></button></div></section>
</main><nav class="nav"><button id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-6h6v6"/></svg>Главная</button><button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Профиль</button><button id="bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"/></svg>Бот</button></nav></div>
<script>
var icons={paladin:'paladin.png',necromancer:'necromancer.png',rogue:'rogue.png',mage:'mage.png',berserker:'berserker.png'},names={paladin:'Паладин',necromancer:'Некромант',rogue:'Разбойница',mage:'Маг стихий',berserker:'Берсерк'},roles={student:'Ученик',teacher:'Учитель',leader:'Староста'};var current=localStorage.getItem('avatar_class')||'paladin',role=localStorage.getItem('user_role')||'student';var id=localStorage.getItem('max_id');if(!id){id='MAX-'+Math.floor(100000+Math.random()*900000);localStorage.setItem('max_id',id)}
function update(){var school=localStorage.getItem('school_name')||'';document.getElementById('name').textContent=localStorage.getItem('user_name')||'Ученик';document.getElementById('maxId').textContent=id;document.getElementById('avatar').src=icons[current];document.getElementById('heroText').textContent=names[current];document.getElementById('role').value=role;document.getElementById('roleText').textContent=roles[role];document.getElementById('roleBadge').textContent=roles[role];document.getElementById('school').value=school;document.getElementById('schoolText').textContent=school||'Школа не привязана'}
Object.keys(names).forEach(function(key){var item=document.createElement('button');item.className='hero'+(key===current?' selected':'');item.innerHTML='<img src="'+icons[key]+'" alt=""><span>'+names[key]+'</span>';item.onclick=function(){current=key;document.querySelectorAll('#heroes .hero').forEach(function(x){x.classList.remove('selected')});item.classList.add('selected')};document.getElementById('heroes').appendChild(item)});document.querySelectorAll('[data-open]').forEach(function(row){row.onclick=function(){document.getElementById(row.dataset.open).classList.toggle('open')}});document.getElementById('saveHero').onclick=function(){localStorage.setItem('avatar_class',current);update()};document.querySelectorAll('[data-outfit]').forEach(function(item){item.onclick=function(){document.querySelectorAll('[data-outfit]').forEach(function(x){x.classList.remove('selected')});item.classList.add('selected');localStorage.setItem('avatar_outfit',item.dataset.outfit);document.getElementById('outfitText').textContent=item.dataset.outfit+' стиль'}});document.getElementById('saveSchool').onclick=function(){localStorage.setItem('school_name',document.getElementById('school').value.trim());update()};document.getElementById('saveRole').onclick=function(){role=document.getElementById('role').value;localStorage.setItem('user_role',role);update()};document.getElementById('theme').onclick=function(){var value=localStorage.getItem('dark_theme')!=='true';localStorage.setItem('dark_theme',value);document.getElementById('theme').classList.toggle('on',value)};document.getElementById('back').onclick=document.getElementById('home').onclick=function(){location.href='app.html'};update();
</script>
<script>
document.body.classList.toggle('dark',localStorage.getItem('dark_theme')==='true');document.getElementById('theme').classList.toggle('on',localStorage.getItem('dark_theme')==='true');
var schoolRow=document.querySelector('[data-open="schoolControl"]');
if(schoolRow){schoolRow.removeAttribute('data-open');schoolRow.onclick=function(){alert('Переход в Сферум скоро будет доступен')};schoolRow.querySelector('.copy strong').textContent='Войти в Сферум';schoolRow.querySelector('.copy span').textContent='Привязка школы и учебного профиля'}
var roleRow=document.querySelector('[data-open="roleControl"]');
if(roleRow){roleRow.removeAttribute('data-open');roleRow.onclick=null;roleRow.querySelector('.arrow').textContent='';}
document.getElementById('theme').onclick=function(){var dark=!document.body.classList.contains('dark');localStorage.setItem('dark_theme',dark);document.body.classList.toggle('dark',dark);this.classList.toggle('on',dark)};
document.getElementById('bot').onclick=function(){location.href='bot.html'};
</script></body></html>
