<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Расписание — MAX App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17233d;
      --muted: #74809a;
      --paper: #f7f8fc;
      --surface: #ffffff;
      --line: #e7eaf1;
      --blue: #5479e8;
      --coral: #ff6b57;
      --teal: #20a995;
      --event: #9a67d6;
      --shadow: 0 16px 44px rgba(23, 35, 61, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #eef1fb 0%, #fdf8f5 55%, #e9f5f3 100%);
      font-family: 'DM Sans', sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    header h1 { margin: 0; font: 700 20px 'Space Grotesk', sans-serif; }
    .back-button { width: 38px; height: 38px; color: var(--ink); background: transparent; border: 0; font-size: 30px; line-height: 1; cursor: pointer; }
    .header-space { width: 38px; }

    main { flex: 1; padding: 24px 20px 34px; }
    .intro { margin-bottom: 21px; }
    .eyebrow { margin: 0 0 5px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .intro h2 { margin: 0; font: 700 26px 'Space Grotesk', sans-serif; letter-spacing: -.03em; }
    .intro p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -20px 28px;
      padding: 4px 20px 9px;
      scrollbar-width: thin;
      scrollbar-color: #c8cfdf transparent;
    }

    .date-strip::-webkit-scrollbar { height: 5px; }
    .date-strip::-webkit-scrollbar-thumb { background: #c8cfdf; border-radius: 10px; }
    .date-button { min-width: 62px; padding: 11px 8px; color: var(--muted); background: rgba(255, 255, 255, .74); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: .2s; }
    .date-button:hover { border-color: #b9c4e4; transform: translateY(-2px); }
    .date-button.selected { color: #fff; background: var(--blue); border-color: var(--blue); box-shadow: 0 8px 17px rgba(84, 121, 232, .25); }
    .date-number { display: block; font: 700 20px 'Space Grotesk', sans-serif; line-height: 1; }
    .date-weekday { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

    .schedule-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 17px; }
    .schedule-head h3 { margin: 0; font: 700 18px 'Space Grotesk', sans-serif; }
    .schedule-date { color: var(--muted); font-size: 12px; }
    .timeline { position: relative; }
    .timeline::before { content: ''; position: absolute; top: 10px; bottom: 10px; left: 68px; width: 2px; background: #dce2f0; }
    .timeline-item { display: grid; grid-template-columns: 54px 1fr; gap: 22px; position: relative; min-height: 92px; }
    .timeline-time { padding-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; text-align: right; }
    .timeline-time strong { display: block; color: var(--ink); font-size: 12px; }
    .timeline-marker { position: absolute; top: 7px; left: 62px; width: 14px; height: 14px; background: var(--blue); border: 3px solid var(--paper); border-radius: 50%; box-shadow: 0 0 0 2px #cbd5f0; z-index: 1; }
    .timeline-card { margin-bottom: 12px; padding: 14px 15px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 15px; box-shadow: 0 5px 14px rgba(23, 35, 61, .04); }
    .timeline-card h4 { margin: 0 0 5px; font: 700 15px 'Space Grotesk', sans-serif; }
    .timeline-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .homework-preview { display: block; overflow: hidden; margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .homework-preview strong { color: var(--blue); }
    .timeline-card { cursor: pointer; }
    .timeline-card:hover { border-color: #b9c4e4; transform: translateY(-2px); }
    .timeline-item.event .timeline-marker { background: var(--event); box-shadow: 0 0 0 2px #decff2; }
    .timeline-item.event .timeline-card { border-left-color: var(--event); background: #fbf8ff; }
    .event-label { display: inline-block; margin-bottom: 7px; padding: 4px 7px; color: var(--event); background: #f1eaff; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .empty-state { padding: 35px 20px; text-align: center; color: var(--muted); background: rgba(255, 255, 255, .68); border: 1px dashed #cbd2e2; border-radius: 18px; }
    .empty-state svg { width: 30px; height: 30px; margin-bottom: 10px; color: var(--blue); }
    .empty-state p { margin: 0; font-size: 13px; }

    .homework-modal { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; padding: 20px; background: rgba(23, 35, 61, .48); backdrop-filter: blur(5px); }
    .homework-modal.open { display: flex; }
    .modal-card { width: min(100%, 420px); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: 20px; box-shadow: 0 22px 60px rgba(23, 35, 61, .25); }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 20px 16px; color: #fff; background: var(--blue); border-radius: 20px 20px 0 0; }
    .modal-header.event { background: var(--event); }
    .modal-label { margin: 0 0 5px; color: rgba(255,255,255,.75); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .modal-header h3 { margin: 0; font: 700 21px 'Space Grotesk', sans-serif; }
    .close-modal { width: 30px; height: 30px; color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 9px; font-size: 22px; line-height: 1; cursor: pointer; }
    .modal-body { padding: 18px 20px 20px; }
    .modal-row { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .modal-row:last-child { border-bottom: 0; }
    .modal-row label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .modal-row p { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.45; }

    body.dark { --ink: #f4f5f8; --muted: #aab4c8; --paper: #0e0f13; --surface: #24272f; --line: #383c46; background: #0e0f13; }
    body.dark header { background: rgba(21, 23, 28, .95); border-color: #272a32; }
    body.dark .back-button, body.dark .timeline-time strong, body.dark .schedule-head h3, body.dark .intro h2 { color: #fff; }
    body.dark .date-button, body.dark .empty-state { color: var(--muted); background: #24272f; border-color: #383c46; }
    body.dark .date-button.selected { color: #fff; background: var(--blue); border-color: var(--blue); }
    body.dark .timeline::before { background: #3b4354; }
    body.dark .timeline-marker { border-color: var(--paper); }
    body.dark .timeline-card { background: #24272f; border-color: #383c46; }
    body.dark .timeline-item.event .timeline-card { background: #2b2636; border-color: #4d405d; border-left-color: var(--event); }
    body.dark .modal-card { background: #24272f; }
    body.dark .modal-row { border-color: #383c46; }
    body.dark .modal-row p { color: #f4f5f8; }

    @media (min-width: 600px) {
      body { padding: 20px 0; }
      .app { min-height: calc(100vh - 40px); overflow: hidden; border-radius: 28px; box-shadow: var(--shadow); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="back-button" id="backButton" aria-label="Назад">‹</button>
      <h1>Расписание</h1>
      <div class="header-space"></div>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">Школьный день</p>
        <h2>Моё расписание</h2>
        <p>Выбери дату, чтобы посмотреть уроки и события.</p>
      </section>

      <div class="date-strip" id="dateStrip" aria-label="Выбор даты"></div>

      <section>
        <div class="schedule-head">
          <h3 id="selectedDateTitle">Сегодня</h3>
          <span class="schedule-date" id="selectedDateText"></span>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
    </main>

  </div>

  <div class="homework-modal" id="homeworkModal" role="dialog" aria-modal="true" aria-labelledby="modalSubject">
    <div class="modal-card">
      <div class="modal-header" id="modalHeader">
        <div>
          <p class="modal-label" id="modalType">Домашнее задание</p>
          <h3 id="modalSubject"></h3>
        </div>
        <button class="close-modal" id="closeModal" aria-label="Закрыть">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-row"><label>Учитель</label><p id="modalTeacher"></p></div>
        <div class="modal-row"><label>Срок сдачи</label><p id="modalDueDate"></p></div>
        <div class="modal-row"><label>Задание</label><p id="modalHomework"></p></div>
      </div>
    </div>
  </div>

  <script>
    // This object can later be replaced with data loaded from an API or JSON file.
    const scheduleData = {
      '2026-09-23': [
        { type: 'lesson', subject: 'География', start: '08:30', end: '09:15' },
        { type: 'lesson', subject: 'Геометрия', start: '09:25', end: '10:10' },
        { type: 'lesson', subject: 'Русский язык', start: '10:20', end: '11:05' },
        { type: 'event', subject: 'Мероприятие в зале', start: '13:00', end: '14:00', details: 'Общешкольное событие' }
      ]
    };

    const homeworkTemplates = {
      'География': ['§ 12, прочитать и ответить на вопросы', 'Повторить природные зоны, подготовить мини-конспект', 'Контурная карта: отметить реки России'],
      'Геометрия': ['№ 148 и № 150 в рабочей тетради', 'Повторить признаки равенства треугольников', 'Решить задачи по теме «Углы»'],
      'Русский язык': ['Упражнение 56, выписать орфограммы', 'Повторить правило и выполнить задание в тетради', 'Подготовить пять примеров на новую тему']
    };
    const teacherNames = ['Анна Сергеевна', 'Илья Андреевич', 'Мария Викторовна'];
    const dueDates = ['25.09.2026', '26.09.2026', '28.09.2026'];

    function enrichLesson(item, index) {
      if (item.type !== 'lesson') return item;
      const options = homeworkTemplates[item.subject] || ['Повторить материал прошлого урока'];
      return Object.assign({}, item, {
        teacher: teacherNames[index % teacherNames.length],
        homework: options[index % options.length],
        dueDate: dueDates[index % dueDates.length]
      });
    }

    const weekdays = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
    const monthNames = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const today = new Date();
    const dateStrip = document.getElementById('dateStrip');
    const timeline = document.getElementById('timeline');
    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const selectedDateText = document.getElementById('selectedDateText');

    function toDateKey(date) {
      return date.toISOString().slice(0, 10);
    }

    function formatDate(date) {
      return date.getDate() + ' ' + monthNames[date.getMonth()];
    }

    function createDateStrip() {
      for (let offset = -2; offset <= 2; offset += 1) {
        const date = new Date(today);
        date.setDate(today.getDate() + offset);

        const button = document.createElement('button');
        button.className = 'date-button';
        button.dataset.date = toDateKey(date);
        button.innerHTML = '<span class="date-number">' + date.getDate() + '</span><span class="date-weekday">' + weekdays[date.getDay()] + '</span>';

        if (offset === 0) {
          button.classList.add('selected');
        }

        button.addEventListener('click', function() {
          document.querySelectorAll('.date-button').forEach(function(item) {
            item.classList.remove('selected');
          });
          button.classList.add('selected');
          renderSchedule(button.dataset.date);
        });

        dateStrip.appendChild(button);
      }
    }

    function renderSchedule(dateKey) {
      const selectedDate = new Date(dateKey + 'T12:00:00');
      const items = (scheduleData[dateKey] || []).map(enrichLesson).slice().sort(function(first, second) {
        return first.start.localeCompare(second.start);
      });

      selectedDateTitle.textContent = dateKey === toDateKey(today) ? 'Сегодня' : weekdays[selectedDate.getDay()];
      selectedDateText.textContent = formatDate(selectedDate);
      timeline.innerHTML = '';

      if (items.length === 0) {
        timeline.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01"/></svg><p>На этот день расписания нет</p></div>';
        return;
      }

      items.forEach(function(item) {
        const timelineItem = document.createElement('article');
        timelineItem.className = 'timeline-item ' + item.type;
        const extraInfo = item.details ? '<p>' + item.details + '</p>' : '';
        const homework = item.type === 'lesson' ? '<span class="homework-preview"><strong>ДЗ:</strong> ' + item.homework + '</span>' : '';
        const eventLabel = item.type === 'event' ? '<span class="event-label">Мероприятие</span>' : '';

        timelineItem.innerHTML = '<div class="timeline-time"><strong>' + item.start + '</strong>' + item.end + '</div>'
          + '<span class="timeline-marker"></span>'
          + '<div class="timeline-card">' + eventLabel + '<h4>' + item.subject + '</h4>' + extraInfo + homework + '</div>';
        timelineItem.querySelector('.timeline-card').addEventListener('click', function() {
          openDetails(item);
        });
        timeline.appendChild(timelineItem);
      });
    }

    function openDetails(item) {
      const isLesson = item.type === 'lesson';
      document.getElementById('modalHeader').classList.toggle('event', !isLesson);
      document.getElementById('modalType').textContent = isLesson ? 'Домашнее задание' : 'Школьное мероприятие';
      document.getElementById('modalSubject').textContent = item.subject;
      document.getElementById('modalTeacher').textContent = isLesson ? item.teacher : 'Школьная администрация';
      document.getElementById('modalDueDate').textContent = isLesson ? item.dueDate : item.start + '–' + item.end;
      document.getElementById('modalHomework').textContent = isLesson ? item.homework : item.details || 'Подробности мероприятия будут опубликованы позже.';
      document.getElementById('homeworkModal').classList.add('open');
    }

    function closeDetails() {
      document.getElementById('homeworkModal').classList.remove('open');
    }

    document.getElementById('backButton').addEventListener('click', function() {
      window.location.href = 'app.html';
    });

    document.getElementById('closeModal').addEventListener('click', closeDetails);
    document.getElementById('homeworkModal').addEventListener('click', function(event) {
      if (event.target.id === 'homeworkModal') closeDetails();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeDetails();
    });

    document.body.classList.toggle('dark', localStorage.getItem('dark_theme') === 'true');
    createDateStrip();
    renderSchedule(toDateKey(today));
  </script>
</body>
</html>
