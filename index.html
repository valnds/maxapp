<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Вход — MAX App</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(ellipse at top, #2e0854 0%, #0f0a21 50%, #05030a 100%);
      --card-bg: rgba(25, 16, 48, 0.75);
      --card-border: 1px solid rgba(168, 85, 247, 0.35);
      --text-main: #f3f0ff;
      --text-secondary: #a799cc;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --grad-btn: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #3b82f6 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 2;
    }

    @media (min-width: 600px) {
      .app-viewport {
        min-height: auto;
        padding: 40px 24px;
      }
    }

    .embers {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .ember {
      position: absolute;
      border-radius: 50%;
      bottom: -10px;
      animation: float-up 9s infinite linear;
    }
    @keyframes float-up {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(0.2); opacity: 0; }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 86px;
      height: 86px;
      background: radial-gradient(circle, #3b1578 0%, #0f0724 100%);
      border: 2px solid var(--accent-purple);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'MedievalSharp', cursive;
      font-size: 46px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(59, 130, 246, 0.3);
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
    }

    h1 {
      font-family: 'MedievalSharp', cursive;
      margin: 0 0 6px;
      font-size: 28px;
      background: linear-gradient(135deg, #f3f0ff 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.15);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-family: 'MedievalSharp', cursive;
      font-size: 15px;
      margin-bottom: 8px;
      color: #c084fc;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      background: rgba(10, 6, 20, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.35), inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--grad-btn);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'MedievalSharp', cursive;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
      transition: all 0.2s;
    }

    .submit-btn:hover {
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.7);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.2);
    }

    :root { --ink:#17233d; --muted:#74809a; --paper:#f7f8fc; --coral:#ff6b57; --line:#e7eaf1; }
    body { font-family:'DM Sans',sans-serif; background:linear-gradient(145deg,#eef1fb 0%,#fdf8f5 55%,#e9f5f3 100%); color:var(--ink); }
    .app-viewport { max-width:480px; padding:34px 20px; }
    .embers { opacity:.18; }
    .logo-container { margin-bottom:28px; }
    .logo { width:72px; height:72px; margin-bottom:14px; border:0; border-radius:22px; background:var(--ink); color:#fff; font:700 36px 'Space Grotesk',sans-serif; box-shadow:0 14px 28px rgba(23,35,61,.18); text-shadow:none; }
    h1 { color:var(--ink); background:none; -webkit-text-fill-color:initial; font:700 28px 'Space Grotesk',sans-serif; letter-spacing:-.03em; }
    .subtitle { color:var(--muted); font-size:11px; letter-spacing:.12em; }
    .form-card { padding:24px 20px; background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9); border-radius:22px; box-shadow:0 18px 44px rgba(23,35,61,.1); }
    .form-group label { color:var(--ink); font:700 13px 'DM Sans',sans-serif; }
    .form-group input { padding:14px; background:#f7f8fc; border:1px solid var(--line); border-radius:12px; color:var(--ink); box-shadow:none; }
    .form-group input:focus { border-color:var(--coral); box-shadow:0 0 0 4px rgba(255,107,87,.12); }
    .submit-btn { padding:15px; background:var(--coral); border-radius:13px; font:700 15px 'DM Sans',sans-serif; box-shadow:0 8px 18px rgba(255,107,87,.24); }
    .submit-btn:hover { box-shadow:0 10px 24px rgba(255,107,87,.3); }
  </style>
</head>
<body>

  <div class="embers" id="embers"></div>

  <div class="app-viewport">
    <div class="logo-container">
      <div class="logo">M</div>
      <h1>MAX App</h1>
      <p class="subtitle">Приложение макса</p>
    </div>
    
    <div class="form-card">
      <div class="form-group">
        <label>Ваше имя и фамилия</label>
        <input type="text" id="userName" placeholder="Иван Иванов" />
      </div>
      <div class="form-group">
        <label>Ваш класс</label>
        <input type="number" id="userClass" placeholder="5" min="1" max="11" />
      </div>
      <button class="submit-btn" id="submitBtn">Продолжить →</button>
    </div>
  </div>

  <script>
    const embersContainer = document.getElementById('embers');
    const colors = ['rgba(168, 85, 247, 0.8)', 'rgba(59, 130, 246, 0.8)', 'rgba(6, 182, 212, 0.8)'];
    for (let i = 0; i < 18; i++) {
      const ember = document.createElement('div');
      ember.classList.add('ember');
      ember.style.left = Math.random() * 100 + '%';
      ember.style.width = Math.random() * 6 + 2 + 'px';
      ember.style.height = ember.style.width;
      ember.style.background = colors[Math.floor(Math.random() * colors.length)];
      ember.style.boxShadow = '0 0 8px ' + ember.style.background;
      ember.style.animationDelay = Math.random() * 8 + 's';
      ember.style.animationDuration = Math.random() * 6 + 5 + 's';
      embersContainer.appendChild(ember);
    }

    document.getElementById("submitBtn").addEventListener("click", function() {
      var name = document.getElementById("userName").value.trim();
      var cls = document.getElementById("userClass").value.trim();
      if (!name) { alert("Введите имя"); return; }
      if (!cls) { alert("Введите класс"); return; }
      localStorage.setItem("user_name", name);
      localStorage.setItem("user_class", cls);
      window.location.href = "app.html";
    });
  </script>
</body>
</html>
